worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  # Writable paths for the non-root master and worker processes.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Re-resolve the service after Compose replaces the backend container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream calculator_api {
    zone calculator_api 64k;
    server backend:4000 resolve;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location = /calculate {
      # Let Go enforce its 64 KiB limit and return the API's JSON error.
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_pass http://calculator_api;
    }

    location = /healthcheck {
      proxy_pass http://calculator_api;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
